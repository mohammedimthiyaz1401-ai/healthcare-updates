name: Daily Healthcare News Update

on:
  schedule:
    - cron: '0 3 * * *'  # 3 AM UTC daily (8:30 AM IST)
  workflow_dispatch:

jobs:
  fetch-news:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests feedparser beautifulsoup4

      - name: Fetch Healthcare News
        run: python scripts/fetch_news.py
        env:
          PYTHONUNBUFFERED: 1

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          git diff --cached --quiet || git commit -m "Auto: update healthcare news $(date +\%Y-\%m-\%d)"
          git push
